name: Release (installers)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Regenerate the icon
        if: runner.os != 'Windows'
        run: python3 build/make-icon.py || true

      - name: Test
        run: npm test

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          # only the finished installers, not the unpacked trees or block maps
          find dist -maxdepth 1 -type f \
            \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" \
               -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Flatten and checksum
        shell: bash
        run: |
          mkdir -p release
          find staging -type f -exec cp {} release/ \;
          cd release
          # write the sums to a temp path first so the output file can never
          # hash itself into the list
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
